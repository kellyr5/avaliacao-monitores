<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Code da Avaliação</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#ffffff;--fg:#152033;--muted:#5b6678;--line:#d9dfe8;--accent:#1b4f9c;--display:"Source Serif 4",Georgia,serif;--body:"IBM Plex Sans",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.5 var(--body);padding:24px 16px 40px}
main{max-width:1000px;margin:0 auto}
h1{font:700 2rem/1.15 var(--display);margin:0 0 4px;text-wrap:balance}
p.lead{color:var(--muted);margin:0 0 24px}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tabs button{font:600 1rem var(--body);padding:10px 20px;border-radius:8px;border:1px solid var(--accent);background:none;color:var(--accent);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:#fff}
.box{display:flex;gap:32px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;padding:28px}
#qr{background:#fff;padding:12px;border-radius:8px;line-height:0}
.info{flex:1;min-width:240px}
.info h2{font:700 1.5rem var(--display);margin:0 0 6px}
.info p{margin:0 0 10px;color:var(--muted)}
.url{font:600 1rem var(--body);word-break:break-all;color:var(--fg)}
</style>
</head>
<body>
<main>
  <h1>Responda pelo celular</h1>
  <p class="lead">Aponte a câmera para o código. Leva cerca de 2 minutos e não precisa de conta.</p>
  <div class="tabs">
    <button type="button" id="b-aluno" aria-pressed="true">Sou aluno</button>
    <button type="button" id="b-mon" aria-pressed="false">Sou ou fui monitor</button>
  </div>
  <div class="box">
    <div id="qr"></div>
    <div class="info">
      <h2 id="t"></h2>
      <p id="d"></p>
      <p class="url" id="u"></p>
    </div>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const BASE="https://avaliacao-unifei.github.io/";
const ITENS={
  aluno:{url:BASE+"aluno.html",t:"Formulário para alunos",d:"Veja as telas da plataforma e diga se ajudariam você. Anônimo."},
  mon:{url:BASE,t:"Formulário para monitores",d:"Avalie fórum, pedidos de ajuda, chats e voluntariado depois de ver as telas."}
};
let qr=null;
function mostrar(k){
  const it=ITENS[k];
  document.getElementById("qr").innerHTML="";
  qr=new QRCode(document.getElementById("qr"),{text:it.url,width:320,height:320,correctLevel:QRCode.CorrectLevel.M});
  document.getElementById("t").textContent=it.t;
  document.getElementById("d").textContent=it.d;
  document.getElementById("u").textContent=it.url;
  document.getElementById("b-aluno").setAttribute("aria-pressed",k==="aluno");
  document.getElementById("b-mon").setAttribute("aria-pressed",k==="mon");
}
document.getElementById("b-aluno").onclick=()=>mostrar("aluno");
document.getElementById("b-mon").onclick=()=>mostrar("mon");
mostrar("aluno");
</script>
</body>
</html>
